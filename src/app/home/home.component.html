
<body>
  <div class="container">

<main class="main-content">
  <h1>Bienvenue sur le tableau de bord</h1>

  <div class="card-grid">
    <div class="card"  *ngFor="let p of recetteArray">
      <div class="row">
        <img src="/{{p.image}}" alt="Image 1" class="col-sm-4">
        <div class="col-sm-8">
          <h3 id="titre">{{ p.nom }}</h3>
          <p id="dis">{{ p.category }}</p>

        </div>

      </div>


      </div>
    </div>





</main>


  </div>
</body>
